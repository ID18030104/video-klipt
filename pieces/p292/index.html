<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Une journée chez Les Petits Pas</title>
<!--
DIRECTION
Concept: la journée d'un enfant racontée comme un sentier — une trace de petits pas continue traverse les 6 slides, une frise horaire 7h30 → 17h suit la journée.
Palette: crème #FBF3E4, vert forêt #2F5D46, terracotta #E0714A, soleil #F2B84B, sauge #CFE0C3, encre #2A2A24
Type: Fraunces (titres, chiffres) + Nunito (texte)
Graphic: illustrations SVG gouachées à plat, formes organiques, grain papier
Motion: n/a (carrousel statique)
-->

<link rel="stylesheet" href="../../node_modules/@fontsource/fraunces/800.css">

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:#222}
body{font-family:Nunito,sans-serif;color:var(--ink)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cream)}
.slide.dark{background:var(--green);color:var(--cream)}
.slide.warm{background:#F6E2C0}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.dark .grain{mix-blend-mode:screen;opacity:.07}
.head{position:absolute;left:72px;right:72px;top:60px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{display:flex;align-items:center;gap:14px;font-family:Fraunces;font-weight:800;font-size:31px;line-height:1;letter-spacing:-.3px}
.logo small{display:block;font-family:Nunito;font-weight:700;font-size:17px;letter-spacing:2.4px;text-transform:uppercase;opacity:.7;margin-top:5px}
.num{font-family:Fraunces;font-weight:600;font-size:30px;opacity:.75}
.num b{font-weight:800;opacity:1}
.time{position:absolute;left:72px;right:72px;top:150px;z-index:10}
.time svg{display:block}
.tag{font-family:Nunito;font-weight:800;font-size:30px;letter-spacing:3px;text-transform:uppercase;color:var(--terra)}
.dark .tag{color:var(--sun)}
.big{font-family:Fraunces;font-weight:800;letter-spacing:-6px;line-height:.85}
h2{font-family:Fraunces;font-weight:800;font-size:92px;line-height:.98;letter-spacing:-2.5px}
h2 em{font-style:italic;font-weight:600;color:var(--terra)}
.dark h2 em{color:var(--sun)}
p.b{font-size:38px;line-height:1.32;font-weight:400}
p.b b{font-weight:800}
.ill{position:absolute;z-index:5}
.trail{position:absolute;left:0;top:1090px;width:1080px;height:200px;z-index:6;overflow:hidden}
.trail svg{position:absolute;top:0}
.swipe{position:absolute;right:72px;bottom:44px;z-index:10;display:flex;align-items:center;gap:14px;font-weight:800;font-size:28px;letter-spacing:1.5px;text-transform:uppercase}
.swipe i{display:block;width:64px;height:64px;border-radius:50%;background:var(--terra);position:relative}
.swipe i:after{content:"";position:absolute;left:19px;top:29px;width:24px;height:4px;background:#fff;border-radius:2px}
.swipe i:before{content:"";position:absolute;left:33px;top:23px;width:14px;height:14px;border-right:4px solid #fff;border-top:4px solid #fff;transform:rotate(45deg) scale(.9);transform-origin:center;border-radius:2px}
.foot{position:absolute;left:72px;bottom:52px;z-index:10;font-weight:700;font-size:28px;opacity:.75}
.chip{display:inline-block;background:var(--green);color:var(--cream);font-weight:800;font-size:30px;padding:12px 26px;border-radius:99px}

const W=1080;
const stops=[["7h30",0],["9h30",1],["10h30",2],["12h",3],["13h",4],["16h30",5]];
function head(i,dark){
  return `<div class="head"><div class="logo"><svg width="54" height="54"><use href="#mark"/></svg><div>Les Petits Pas<small>Micro-crèche · Rouen</small></div></div><div class="num"><b>0${i}</b> / 06</div></div>`;
}
// timeline: 6 stops, active index a (0..5) or -1
function timeline(active,dark){
  const c=dark?'#FBF3E4':'#2F5D46', acc=dark?'#F2B84B':'#E0714A';
  const labels=["7h30","9h30","10h30","12h","13h","16h30"];
  let s=`<svg width="936" height="90" viewBox="0 0 936 90"><line x1="40" y1="24" x2="896" y2="24" stroke="${c}" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>`;
  if(active>0)s+=`<line x1="40" y1="24" x2="${40+active*171.2}" y2="24" stroke="${acc}" stroke-width="6" stroke-linecap="round"/>`;
  labels.forEach((l,k)=>{const x=40+k*171.2;const on=k===active,past=k<active;
    s+=`<circle cx="${x}" cy="24" r="${on?16:9}" fill="${on||past?acc:(dark?'#2F5D46':'#FBF3E4')}" stroke="${on||past?acc:c}" stroke-opacity="${on||past?1:.4}" stroke-width="3"/>`;
    s+=`<text x="${x}" y="78" text-anchor="middle" font-family="Nunito" font-weight="${on?800:700}" font-size="24" fill="${on?acc:c}" fill-opacity="${on?1:.6}">${l}</text>`;});
  return s+`</svg>`;
}
// footprint trail continuous across slides
function trailSVG(i,dark){
  const col=dark?'#F2B84B':'#E0714A';
  const total=6*W; let out='';
  const step=84;
  for(let k=0;k*step<total+step;k++){
    const x=k*step+20;
    const y=110+Math.sin(x/W*Math.PI*2*1.3)*34;
    const dy=Math.cos(x/W*Math.PI*2*1.3)*34*Math.PI*2*1.3/W;
    const ang=Math.atan2(dy,1)*180/Math.PI+90;
    const side=k%2?1:-1;
    const px=x-Math.sin(ang*Math.PI/180)*0, off=side*13;
    // foot: oval + 4 toes, pointing along direction (rotate around origin, direction = +x → foot points +x)
    const a=Math.atan2(dy,1)*180/Math.PI;
    out+=`<g transform="translate(${x} ${y+off*1.4}) rotate(${a}) scale(1.35)" opacity="${.35+((k%6)/6)*0.0+0.55}"><ellipse cx="0" cy="0" rx="17" ry="10.5" fill="${col}"/><circle cx="23" cy="-7" r="3.8" fill="${col}"/><circle cx="26.5" cy="-1.5" r="3.6" fill="${col}"/><circle cx="26.5" cy="4.5" r="3.4" fill="${col}"/><circle cx="23" cy="9.5" r="3" fill="${col}"/></g>`;
  }
  return `<div class="trail"><svg width="${total}" height="200" style="left:${-i*W}px" viewBox="0 0 ${total} 200">${out}</svg></div>`;
}
const grain=`<svg class="grain" width="1080" height="1350"><rect width="1080" height="1350" filter="url(#paper)"/></svg>`;
