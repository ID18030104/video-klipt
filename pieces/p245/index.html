  const lift = lerp(0, 2.05, up), sx = lerp(0, 1.25, side);
  dropper.position.set(lerp(sx,0,back), lerp(lift - side*0.55, 0, back), lerp(side*0.35,0,back));
  pipLiq.visible = t>3.2 && t<6.7; pipette.visible = pipLiq.visible;
  // world pos of the pipette tip
  const tip = V(0,tipY,0); dropper.localToWorld(tip.copy(V(0,tipY,0)));
  bottle.updateMatrixWorld(true); const tipW = dropper.localToWorld(V(0,tipY,0));
  // drop forms 4.3–4.9, falls 4.9–5.35
  const form = ease.outCubic(prog(t,4.3,0.6)), fall = prog(t,4.95,0.42);
  const floorY = 0.0;
  if(t<4.3 || t>5.4){ drop.visible=false; }
  else { drop.visible=true;
    const y = tipW.y - 0.06 - form*0.05 - fall*fall*(tipW.y-0.13);
    drop.position.set(tipW.x, Math.max(floorY+0.07,y), tipW.z);
    const s = lerp(0.2,1,form); drop.scale.set(s*(1-fall*0.15), s*(1+ fall*0.35 + form*0.15), s*(1-fall*0.15)); }
  const landT = 5.37;
  ripples.forEach((m,i)=>{ const p=prog(t,landT+i*0.18,1.6); m.visible = p>0 && p<1; const sc=lerp(0.08,0.9+i*0.2,ease.outCubic(p));
    m.scale.set(sc,sc,sc); m.material.opacity = (1-p)*0.8; m.position.set(tipW.x,0.012+i*0.001,tipW.z); });
  const pp = ease.outCubic(prog(t,landT,0.5)); puddle.visible = t>landT; puddle.scale.setScalar(lerp(0.2,1,pp)); puddle.position.set(1.25,0.009,0.35);
  ripples.forEach(m=>{ m.position.x=1.25; m.position.z=0.35; });
  puddle.material.opacity = 1 - smooth(prog(t,9,2));

  // botanicals drift in 6.3 → 8.5, stay
  const inA = ease.outCubic(prog(t,6.2,2.0)), inB = ease.outCubic(prog(t,6.6,2.0));
  flowerA.position.set(lerp(-3.8,-1.35,inA), lerp(2.2,0.28,inA), lerp(1.4,0.9,inA));
  flowerA.rotation.set(lerp(-1.4,0.35,inA), t*0.12, lerp(0.6,0.12,inA));
  flowerA.scale.setScalar(0.95);
  flowerB.position.set(lerp(3.8,2.6,inB), lerp(5.2,3.55,inB), -1.4);
  flowerB.rotation.set(0.95, -t*0.1, -0.5); flowerB.scale.setScalar(1.25);
  const sIn = ease.outCubic(prog(t,6.8,1.6));
  seeds.position.set(1.15, 0, lerp(3.2,0.95,sIn)); seeds.visible = t>6.6;
  seeds.children.forEach(s=>{ const b=s.userData.base; s.position.y = b.y + (1-sIn)*(0.6+Math.sin(s.userData.ph)*0.4); });
  shadow.material.opacity = lerp(0.9,0.55,dk);

  renderer.render(scene, camera);
}

const sky = document.getElementById('sky'), stars = document.getElementById('stars');
const brand = document.getElementById('brand'), stamp = document.getElementById('stamp');
const dawnInk = hex('#0B1026'), nightInk = hex('#F3E4D0');
function render(t){
  const [top,bot] = skyAt(t);
  sky.style.background = `linear-gradient(180deg, ${css(top)} 0%, ${css(mix(top,bot,0.5))} 55%, ${css(bot)} 100%)`;
  const dk = dawnK(t);
  stars.style.opacity = 1 - smooth(prog(t,7.6,2.2));
  const ink = css(mix(nightInk, dawnInk, smooth(prog(t,9.2,1.2))));
  brand.style.color = ink; stamp.style.color = ink;
  clockAt(t);
  tl.seek(t, false);
  draw3d(t);
}
