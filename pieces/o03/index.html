<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Casa Almar — Summer opens 15 May</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/instrument-serif/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/instrument-serif/400-italic.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/700.css">
<style>
:root{--paper:#EFE5D3;--ink:#2B2117;--terra:#B4532F;--sand:#D9C6A5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:var(--paper)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Figtree',sans-serif}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,rgba(255,250,240,.55),rgba(217,198,165,.35));}
.top{position:absolute;left:60px;right:60px;top:56px;display:flex;justify-content:space-between;font-weight:700;font-size:28px;letter-spacing:.24em;text-transform:uppercase;padding-bottom:22px;border-bottom:2px solid var(--ink)}
.top span:last-child{font-weight:500;letter-spacing:.2em}
h1{position:absolute;left:52px;top:128px;font-family:'Instrument Serif',serif;font-weight:400;font-size:214px;line-height:.86;letter-spacing:-.02em}
h1 em{color:var(--terra);font-style:italic;letter-spacing:-.03em}
.arch{position:absolute;left:60px;top:590px;width:540px;height:700px;border-radius:270px 270px 0 0;overflow:hidden;background:var(--sand)}
.arch img{position:absolute;left:-265px;top:-8px;height:716px;filter:sepia(.22) saturate(.95) contrast(1.06) brightness(.98)}
.arch::after,.circ::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(180,83,47,.16),rgba(43,33,23,.18));mix-blend-mode:multiply}
.circ{position:absolute;left:660px;top:560px;width:330px;height:330px;border-radius:50%;overflow:hidden;border:10px solid var(--paper);box-shadow:0 0 0 2px var(--terra);z-index:3}
.circ img{position:absolute;left:-20px;top:-8px;height:356px;filter:sepia(.25) saturate(.92) contrast(1.06)}
.stamp{position:absolute;left:560px;top:806px;width:118px;height:118px;border-radius:50%;background:var(--terra);color:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:27px;line-height:1.05;letter-spacing:.08em;text-transform:uppercase;z-index:4;transform:rotate(-8deg)}
.copy{position:absolute;left:636px;top:930px;width:384px}
.copy p.gift{font-family:'Instrument Serif',serif;font-size:50px;line-height:1.02}
.copy p.gift em{color:var(--terra)}
.copy p.sub{margin-top:22px;font-size:29px;line-height:1.3;font-weight:500;color:#4a3b2c}
.cta{position:absolute;left:636px;bottom:60px;width:384px;height:96px;border-radius:48px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 38px;font-weight:700;font-size:35px;letter-spacing:.02em}
.cta i{font-style:normal;width:68px;height:68px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center;font-size:36px}
.grain{position:absolute;inset:0;z-index:9;opacity:.11;mix-blend-mode:multiply;pointer-events:none}
</style></head><body>
<section class="slide">
  <div class="top"><span>Casa Almar</span><span>Comporta · Portugal</span></div>
  <h1>Summer<br>opens <em>15&nbsp;May.</em></h1>
  <div class="arch"><img src="assets/sun.jpg" alt=""></div>
  <div class="circ"><img src="assets/boat.jpg" alt=""></div>
  <div class="copy">
    <p class="gift">Book direct and a <em>sunset boat trip</em> on the Sado is yours.</p>
    <p class="sub">24 cabanas between the dunes and the rice fields.</p>
  </div>
  <div class="cta"><span>casaalmar.pt</span><i>→</i></div>
  <svg class="grain" width="1080" height="1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 1.1 -.15"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</section>
<script>window.KLIPT={width:1080,height:1350};</script>
</body></html>
