<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Garnier &amp; Fils - 5 signes</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/700.css">

<style>
:root{--bg:#0F2E2C;--cream:#F1E8D6;--cu:#C97B45;--cu-l:#F0B27E;--cu-d:#6A3418;--amb:#E9B44C;--red:#FF6A48;--mut:#A9C2B8;--ink:#0F2E2C}
*{box-sizing:border-box;margin:0}
body{margin:0;background:#000;width:1080px}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#17403C 0%,var(--bg) 70%);color:var(--cream);font-family:'IBM Plex Sans',sans-serif}
.slide.offer{background:radial-gradient(120% 80% at 50% 30%,#FBF4E4 0%,#EADFC6 80%);color:var(--ink)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.brand{position:absolute;top:30px;left:0;right:0;display:flex;justify-content:space-between;padding:0 48px;font:500 22px 'IBM Plex Mono';letter-spacing:.14em;color:var(--mut)}
.brand span:first-child{color:var(--cu-l)}
.offer .brand{color:#5b6b63}.offer .brand span:first-child{color:#9A5327}
.gauge{position:absolute;top:28px;left:0}
.gauge .num{font:800 46px 'Big Shoulders Display';fill:#0F2E2C}
.gauge .arclab{font:800 34px 'Big Shoulders Display';letter-spacing:.16em;fill:#0F2E2C}
.pipe{position:absolute;left:0;right:0;top:690px;height:64px;background:linear-gradient(180deg,#6A3418 0%,#E8A26C 14%,#F6C89C 26%,#C97B45 52%,#8A4A22 82%,#5A2B12 100%);box-shadow:0 10px 18px rgba(0,0,0,.35)}
.fl{position:absolute;top:674px;width:34px;height:96px;background:linear-gradient(90deg,#6A3418,#E8A26C 40%,#8A4A22);border-radius:6px;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.fl-l{left:-6px}.fl-r{right:-6px}
.tee{position:absolute;left:486px;top:674px;width:108px;height:96px;background:linear-gradient(90deg,#6A3418,#F0B27E 35%,#C97B45 65%,#6A3418);border-radius:10px;box-shadow:0 6px 12px rgba(0,0,0,.35)}
.drip{position:absolute;left:990px;top:764px}
.txt{position:absolute;left:64px;right:64px;top:784px}
h1.cover{font:800 128px/.88 'Big Shoulders Display';text-transform:uppercase;letter-spacing:-.005em;margin-top:6px}
h1.cover em{font-style:normal;color:var(--red)}
.sub{font-size:36px;line-height:1.35;margin-top:22px;color:var(--cream);opacity:.9;max-width:820px}
h2{max-width:900px;font:800 100px/.9 'Big Shoulders Display';text-transform:uppercase;letter-spacing:0;display:flex;align-items:flex-start;gap:22px}
.n{font:500 32px 'IBM Plex Mono';color:var(--ink);background:var(--cu-l);padding:6px 12px;border-radius:6px;margin-top:12px;letter-spacing:.04em}
.b{font-size:37px;line-height:1.32;margin-top:16px;max-width:900px}
.a{font-size:36px;line-height:1.3;margin-top:14px;padding-top:14px;border-top:2px dashed rgba(241,232,214,.35);max-width:930px;color:var(--amb);font-weight:600}
.a b{display:inline-block;font:500 24px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;background:var(--amb);color:var(--ink);padding:3px 10px;border-radius:5px;margin-right:12px;vertical-align:3px}
.offer h2.offer{font-size:78px;display:block;line-height:.95}
.price{font:800 140px/.85 'Big Shoulders Display';color:#B2451F;display:block;margin-top:2px}
.offer .b{font-size:34px;margin-top:4px}
.contact{display:flex;flex-direction:column;margin-top:14px;background:var(--ink);color:var(--cream);padding:14px 28px;border-radius:14px}
.tel{font:800 76px/1 'Big Shoulders Display';letter-spacing:.04em;color:var(--cu-l)}
.web{font:500 32px 'IBM Plex Mono'}
.foot{font-size:26px;margin-top:14px;color:#3c4d46}
.sent{position:absolute;left:64px;bottom:34px;font:800 46px 'Big Shoulders Display';text-transform:uppercase;letter-spacing:.06em;color:rgba(169,194,184,.42);display:flex;gap:14px}
.sent .on{color:var(--cu-l);background:rgba(201,123,69,.2);padding:0 12px;margin:0 -12px;border-radius:6px}
.sent .past{color:var(--mut);opacity:.7}
.offer .sent{color:rgba(15,46,44,.35)}.offer .sent .on{color:#9A5327;background:rgba(154,83,39,.15)}.offer .sent .past{color:#3c4d46}
.cnt{position:absolute;right:56px;bottom:42px;font:500 26px 'IBM Plex Mono';color:var(--mut)}
.offer .cnt{color:#3c4d46}
.slide.cover .txt{top:780px}
.offer .txt{top:772px}
