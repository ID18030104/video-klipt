<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/900.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/700.css">
<style>
:root{--bg:#10201B;--brass:#D9A93F;--cream:#F2E8D0;--red:#D4442B;--cell:#1B3129}
*{box-sizing:border-box;margin:0}
body{margin:0;overflow:hidden;background:var(--bg)}
.slide{position:relative;width:1080px;height:1350px;background:var(--bg);overflow:hidden;color:var(--cream)}
.slide:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 10%,#1c3a31,transparent 65%)}
.top{position:absolute;left:64px;right:64px;top:60px;display:flex;justify-content:space-between;font:700 30px 'IBM Plex Mono';letter-spacing:.14em;color:var(--brass)}
.hook{position:absolute;left:52px;top:96px;font:900 400px/0.82 'Big Shoulders Display';color:var(--brass);letter-spacing:-.02em;white-space:nowrap}
.hook small{font-size:190px;letter-spacing:0;color:var(--cream);margin-left:14px}
.sub{position:absolute;left:64px;top:436px;width:952px;font:900 118px/0.92 'Big Shoulders Display';text-transform:uppercase;color:var(--cream);letter-spacing:.005em}
.sub em{font-style:normal;color:var(--red);background:none}
.board{position:absolute;left:0;right:0;bottom:0;height:790px;background:#0a1512;border-top:8px solid var(--brass);padding:34px 48px 0}
.hd{display:flex;justify-content:space-between;font:700 28px 'IBM Plex Mono';letter-spacing:.16em;color:var(--brass);margin-bottom:20px}
.row{display:flex;align-items:center;justify-content:space-between;height:98px;border-bottom:2px dashed #2c463c}
.row.hl{background:var(--brass);margin:0 -48px;padding:0 48px;border:0}
.row.hl .lab{color:#10201B}
.lab{display:flex;gap:6px}
.c{width:37px;height:64px;background:var(--cell);border-radius:5px;color:var(--cream);font:700 46px/64px 'IBM Plex Mono';text-align:center;position:relative}
.c:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#0a1512}
.c.sp{background:none}.c.sp:after{display:none}
.hl .c{background:#10201B;color:var(--brass)}
.tag{font:700 34px 'IBM Plex Mono';color:var(--brass);letter-spacing:.06em;display:flex;align-items:center;gap:12px}
.tag i{width:18px;height:18px;border-radius:50%;background:var(--red)}
.hl .tag{color:#10201B}
.hours{position:absolute;left:48px;right:48px;bottom:44px}
.hours .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.hours b{font:900 76px 'Big Shoulders Display';color:var(--cream);letter-spacing:.01em}
.hours span{font:700 30px 'IBM Plex Mono';color:var(--brass);letter-spacing:.06em}
.days{display:flex;gap:10px}.days div{flex:1;height:54px;background:var(--brass);color:#10201B;font:700 30px/54px 'IBM Plex Mono';text-align:center;border-radius:4px}
.since{position:absolute;right:64px;top:270px;text-align:right;font:700 34px/1.3 'IBM Plex Mono';color:var(--cream);letter-spacing:.08em}
</style></head><body>
<main class="slide">
<div class="top"><span>MINUTE LEFÈVRE</span><span>STRASBOURG</span></div>
<div class="hook">15<small>min</small></div>
<div class="since">DEPUIS<br><b style="color:var(--brass);font-size:56px">1972</b></div>
<div class="sub">Talons refaits <em>pendant que vous attendez.</em></div>
<div class="board">
 <div class="hd"><span>SERVICES</span><span>ATELIER</span></div>
 <div id="rows"></div>
 <div class="hours"><div class="t"><b>LUN.–SAM.</b><span>8H30 → 19H</span></div>
 <div class="days"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div></div></div>
</div>
</main>
<script>
window.KLIPT={width:1080,height:1350};
const rows=[["RESSEMELAGE",""],["TALONS","15 MIN"],["CLÉS",""],["GRAVURE",""],["SACS RÉPARÉS",""]];
const R=document.getElementById('rows');
rows.forEach(([l,t],i)=>{const d=document.createElement('div');d.className='row'+(i==1?' hl':'');
 d.innerHTML='<div class="lab">'+[...l].map(ch=>'<div class="c'+(ch==' '?' sp':'')+'">'+ch+'</div>').join('')+'</div>'+(i==1?'<div class="tag">'+t+'</div>':'<div class="tag"><i></i>SUR PLACE</div>');R.appendChild(d)});
</script></body></html>
