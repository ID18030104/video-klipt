<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Greenloop 2025 impact</title>
<!-- Direction: "Counted, not claimed" - pictogram data poster. Palette #F3EFE6 #0F3B2E #12211B #D4F06A #1F5645. Type: Bricolage Grotesque + IBM Plex Mono. Language: stitched loop, tee pictograms, weave+grain. Still. -->
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/bricolage-grotesque/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/500.css">
<style>
html,body{margin:0;padding:0;background:#F3EFE6;overflow:hidden}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;color:#0F3B2E;font-family:'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums;
 background:
  radial-gradient(ellipse at 50% 45%,transparent 60%,rgba(15,59,46,.05) 100%),
  #F3EFE6;}
.weave{position:absolute;inset:0;opacity:.18;background:
  repeating-linear-gradient(0deg,#D8D0BF 0 1px,transparent 1px 6px),
  repeating-linear-gradient(90deg,#D8D0BF 0 1px,transparent 1px 6px);}
svg.art{position:absolute;left:0;top:0;width:1080px;height:1350px}
.t{position:absolute;white-space:nowrap;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:500}
#hero{left:72px;top:160px;font-size:184px;line-height:.9;letter-spacing:-.04em;font-weight:300}
#hero b{font-weight:800;letter-spacing:-.045em}
#sub{left:80px;top:344px;font-size:42px;line-height:1.2;font-weight:500;letter-spacing:-.01em;color:#12211B}
#eyebrow{left:80px;top:1086px;font-size:30px;letter-spacing:.06em;line-height:1}
#eq{left:76px;top:1124px;font-size:96px;font-weight:800;letter-spacing:-.035em;line-height:.95;isolation:isolate}
.hl{position:relative;display:inline-block}
.hl::before{content:"";position:absolute;left:-8px;right:-8px;bottom:-4px;height:38%;background:#D4F06A;transform:rotate(-1deg);z-index:-1}
#foot1{left:80px;top:1262px;font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:44px;color:#12211B}
#foot2{right:80px;top:1262px;font-size:30px;line-height:44px;color:#0F3B2E}
#tag{right:80px;top:70px;font-size:30px;letter-spacing:.06em;line-height:36px;display:flex;align-items:center;gap:12px}
#tag i{width:10px;height:10px;border-radius:50%;background:#0F3B2E;display:block}
#wm{left:134px;top:64px;font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:48px}
#pill{position:absolute;right:80px;top:1002px;height:56px;box-sizing:border-box;border:2px solid #0F3B2E;border-radius:28px;background:#D4F06A;display:flex;align-items:center;padding:0 24px;gap:12px;font-size:30px;line-height:1}
#pill svg{width:28px;height:26px}
</style></head><body>
<section class="slide">
<div class="weave"></div>
<svg class="art" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <symbol id="tee" viewBox="0 0 44 40"><path d="M15 2 L2 9 L6 19 L11 16.5 L11 38 L33 38 L33 16.5 L38 19 L42 9 L29 2 C28 7 25.5 9 22 9 C18.5 9 16 7 15 2 Z" stroke-linejoin="round" stroke-width="2" stroke="currentColor" fill="currentColor"/></symbol>
  <filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="273"/><feColorMatrix type="saturate" values="0"/></filter>
 </defs>
 <!-- logo -->
 <g transform="translate(100 88)">
  <circle r="18" fill="none" stroke="#0F3B2E" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round" transform="rotate(-50)"/>
  <path d="M6 -21 L13 -16 L5 -13" transform="translate(0 0)" fill="none" stroke="#0F3B2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="-9" cy="15.6" r="5" fill="#D4F06A" stroke="#0F3B2E" stroke-width="1.5"/>
 </g>
 <!-- loop -->
 <path id="loop" d="M560 500 H1016 V1030 H64 V500 H520" transform="" fill="none" stroke="none"/>
 <rect x="64" y="500" width="952" height="530" rx="44" fill="none" stroke="#0F3B2E" stroke-width="4" stroke-dasharray="14 9" stroke-linecap="round" id="loopr"/>
 <rect x="516" y="490" width="48" height="20" fill="#F3EFE6"/>
 <path d="M530 490 L550 500 L530 510" fill="none" stroke="#0F3B2E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 <g id="grid"></g>
 <rect x="0" y="0" width="1080" height="1350" filter="url(#gr)" opacity=".06" style="mix-blend-mode:multiply"/>
</svg>
<div class="t mono" id="tag"><i></i>2025 IMPACT</div>
<div class="t" id="wm">greenloop</div>
<h1 class="t" id="hero"><b>128</b>&nbsp;tonnes</h1>
<div class="t" id="sub">of corporate uniforms, linen and workwear<br>collected and recycled in 2025.</div>
<div id="pill" class="mono"><svg viewBox="0 0 44 40" style="color:#0F3B2E"><use href="#tee" fill="currentColor"/></svg><span>= 1 tonne ≈ 5,000 T-shirts</span></div>
<div class="t mono" id="eyebrow">THAT’S THE WEIGHT OF</div>
<div class="t" id="eq"><span class="hl">640,000</span>&nbsp;T-shirts</div>
<div class="t" id="foot1">Put your old workwear back in the loop.</div>
<div class="t mono" id="foot2">greenloop.eco →</div>
</section>
<script src="../../lib/klipt-kit.js"></script>
<script>
window.KLIPT={width:1080,height:1350};
const g=document.getElementById('grid'),r=KK.rng(273),NS='http://www.w3.org/2000/svg';
for(let i=0;i<128;i++){
 const c=i%16,row=Math.floor(i/16),x=104+c*54.5+(54.5-44)/2,y=540+row*56.25+(56.25-40)/2;
 const u=document.createElementNS(NS,'use');u.setAttribute('href','#tee');u.setAttribute('x',x);u.setAttribute('y',y);u.setAttribute('width',44);u.setAttribute('height',40);
 const v=r();let col=v<.6?'#0F3B2E':v<.85?'#1F5645':'#2F6E59';
 if(i===127){col='#D4F06A';const o=u.cloneNode();o.setAttribute('x',x-2);o.setAttribute('y',y-2);o.setAttribute('width',48);o.setAttribute('height',44);o.style.color='#0F3B2E';g.appendChild(o);u.setAttribute('x',x+.5);u.setAttribute('y',y+.5);u.setAttribute('width',43);u.setAttribute('height',39);}
 u.style.color=col;g.appendChild(u);
}
// pill interrupts seam
const p=document.getElementById('pill');
function fit(){const h=document.getElementById('hero');let fs=184;while(h.scrollWidth>920&&fs>100){fs-=4;h.style.fontSize=fs+'px';}}
document.fonts.ready.then(()=>{fit();});
</script>
</body></html>
