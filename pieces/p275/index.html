<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Atelier Mèche – Balayages -20 %</title>
<!-- DIRECTION
concept: un balayage "peint" — mèches qui passent du châtain profond au miel, dans une arche de salon; le -20 % est le point focal.
palette: crème #F3EADB, brun #2A1A13, terracotta #B4533A, miel #D8A25E, sauge #7F8C6C
type: Gloock (display) + Figtree (texte)
graphic: arche, mèches vectorielles en dégradé, grain papier, sceau rond de marque
-->
<link rel="stylesheet" href="../../node_modules/@fontsource/gloock/index.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/700.css">
<script src="../../lib/klipt-kit.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F3EADB}
.slide{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F3EADB;color:#2A1A13;font-family:Figtree,sans-serif}
svg.bg{position:absolute;inset:0}
.logo{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:16px;font-family:Gloock,serif;font-size:36px;letter-spacing:.01em}
.logo small{display:block;font:700 17px Figtree;letter-spacing:.22em;text-transform:uppercase;color:#B4533A;margin-top:2px}
.kick{position:absolute;left:72px;top:230px;font:700 26px Figtree;letter-spacing:.2em;text-transform:uppercase;color:#B4533A}
h1{position:absolute;left:72px;top:276px;margin:0;font:400 84px/1 Gloock,serif;letter-spacing:-.01em;width:440px}
.big{position:absolute;left:60px;top:560px;font:400 300px/1 Gloock,serif;color:#B4533A;letter-spacing:-.04em;white-space:nowrap}
.big span{font-size:150px;letter-spacing:0;margin-left:10px}
.cond{position:absolute;left:72px;top:860px;font:500 31px/1.35 Figtree;width:600px}
.cond b{font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:0;height:96px;background:#2A1A13;color:#F3EADB;display:flex;align-items:center;justify-content:space-between;padding:0 72px;font:500 28px Figtree}
.foot b{font-weight:700;color:#D8A25E}
</style></head><body>
<section class="slide" id="s">
<svg class="bg" id="art" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<div class="logo"><svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="28" fill="#2A1A13"/><path d="M20 47C20 30 26 16 33 9c1 10 6 15 6 24 0 7-4 12-9 14" fill="none" stroke="#D8A25E" stroke-width="3" stroke-linecap="round"/><path d="M27 47c-1-9 1-17 5-24" fill="none" stroke="#F3EADB" stroke-width="2.5" stroke-linecap="round"/></svg><div>Atelier Mèche<small>Nancy</small></div></div>
<div class="kick">Novembre</div>
<h1>Le balayage qui vous ressemble.</h1>
<div class="big">−20<span>%</span></div>
<div class="cond"><b>sur tous les balayages</b><br>sur rendez-vous, en couleurs naturelles</div>
<div class="foot"><span>Réservez au <b>03 83 27 41 60</b></span><span>@ateliermeche</span></div>
</section>
<script>
window.KLIPT={width:1080,height:1080};
const ns="http://www.w3.org/2000/svg",svg=document.getElementById('art'),r=KK.rng(275);
const E=(n,a,p)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const defs=E('defs',{});
// grain
const f=E('filter',{id:'g',x:0,y:0,width:'100%',height:'100%'},defs);
E('feTurbulence',{type:'fractalNoise',baseFrequency:.8,numOctaves:2,seed:4},f);
E('feColorMatrix',{values:'0 0 0 0 .16  0 0 0 0 .1  0 0 0 0 .07  0 0 0 .55 0'},f);
// arch
const ax=520,aw=460,ay=90,ah=800;
const archD=`M${ax} ${ay+ah}V${ay+aw/2}A${aw/2} ${aw/2} 0 0 1 ${ax+aw} ${ay+aw/2}V${ay+ah}Z`;
const cp=E('clipPath',{id:'arch'},defs);E('path',{d:archD},cp);
const lg=E('linearGradient',{id:'hair',gradientUnits:'userSpaceOnUse',x1:0,y1:ay,x2:0,y2:ay+ah},defs);
[[0,'#2A1A13'],[.35,'#5A3220'],[.6,'#A6693A'],[.85,'#D8A25E'],[1,'#EBC98A']].forEach(([o,c])=>E('stop',{offset:o,'stop-color':c},lg));
E('path',{d:archD,fill:'#D9C3A4'});
const g=E('g',{'clip-path':'url(#arch)'});
E('rect',{x:ax,y:ay,width:aw,height:ah,fill:'#7F8C6C',opacity:.0},g);
// strands
for(let i=0;i<70;i++){
 const x0=ax-30+r()*(aw+60), w=(r()-.5)*90, sw=5+r()*13;
 const d=`M${x0} ${ay-30}C${x0+w*1.6} ${ay+ah*.3},${x0-w*1.2} ${ay+ah*.65},${x0+w*.6} ${ay+ah+30}`;
 E('path',{d,fill:'none',stroke:'url(#hair)',opacity:.55+r()*.45,'stroke-width':sw,'stroke-linecap':'round'},g);
}
// highlight sheen
for(let i=0;i<9;i++){const x0=ax+30+r()*(aw-60),w=(r()-.5)*70;
 E('path',{d:`M${x0} ${ay+ah*.35}C${x0+w} ${ay+ah*.5},${x0-w*.5} ${ay+ah*.7},${x0+w*.3} ${ay+ah}`,fill:'none',stroke:'#F6DDA6',opacity:.5,'stroke-width':3,'stroke-linecap':'round'},g);}
// arch outline offset
E('path',{d:archD,fill:'none',stroke:'#2A1A13','stroke-width':3,transform:'translate(-16 16)'});
// rotating seal
const seal=E('g',{transform:'translate(880 780)'});
E('circle',{r:88,fill:'#B4533A'},seal);
E('circle',{r:78,fill:'none',stroke:'#F3EADB','stroke-width':1.5,'stroke-dasharray':'2 5'},seal);
E('path',{id:'sp',d:'M-58 0a58 58 0 1 1 116 0a58 58 0 1 1 -116 0',fill:'none'},seal);
const tx=E('text',{'font-family':'Figtree','font-weight':700,'font-size':15,fill:'#F3EADB'},seal);
const tp=E('textPath',{href:'#sp',textLength:350,lengthAdjust:'spacing'},tx);tp.textContent='COULEURS NATURELLES · NANCY · ';
const t2=E('text',{'font-family':'Gloock','font-size':44,fill:'#F3EADB','text-anchor':'middle',y:15},seal);t2.textContent='RDV';
// grain overlay
E('rect',{width:1080,height:1080,filter:'url(#g)',opacity:.35,'pointer-events':'none'});
</script>
</body></html>
