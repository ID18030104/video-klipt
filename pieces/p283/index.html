<script>
window.KLIPT={width:1080,height:1920};
(function(){
const cx=540,cy=620,N='http://www.w3.org/2000/svg',g=document.getElementById('dial');
const P=(a,r)=>[cx+r*Math.sin(a*Math.PI/180),cy-r*Math.cos(a*Math.PI/180)];
let s='';
for(let i=0;i<60;i++){const a=i*6,h=i%5==0,[x1,y1]=P(a,h?196:204),[x2,y2]=P(a,212);
s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#141A2E" stroke-width="${h?3:1.5}" stroke-opacity="${h?.75:.3}"/>`;}
for(let k=0;k<10;k++){const [x,y]=P(k*30,166);
s+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="Cormorant Garamond" font-weight="600" font-size="40" style="font-variant-numeric:lining-nums" fill="#141A2E">${12+k}</text>`;}
[300,330].forEach(a=>{const [x,y]=P(a,166);s+=`<circle cx="${x}" cy="${y}" r="4" fill="#141A2E" fill-opacity=".25"/>`;});
const hand=(a,l,w,extra)=>{const [x2,y2]=P(a,l),[x1,y1]=P(a+180,22);return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;};
s+=`<g filter="url(#hs)" transform="translate(5 7)" stroke="rgba(20,26,46,.20)">${hand(255,100,10,'')}${hand(180,124,5,'')}</g>`;
s+=`<g stroke="#141A2E">${hand(255,100,10,'')}${hand(180,124,5,'')}</g>`;
s+=`<circle cx="${cx}" cy="${cy}" r="10" fill="#141A2E"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="#E6B45E"/>`;
g.innerHTML=s;
})();
</script></body></html>
