<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Açores, l’île aux baleines</title>

<!-- DIRECTION
Concept: coucher de soleil sur l'Atlantique, queue de baleine qui sort de l'eau, gravure-affiche de voyage.
Palette: #0B2F3A (océan profond), #12606B (teal), #F4E9D6 (crème), #FF7A59 (corail, rare), #F6B26B (soleil)
Type: Fraunces (titres) + Figtree (infos)
Langage: aplats en couches, soleil, vagues, grain, cartouche crème type billet
Mouvement: aucun (post fixe)
-->
<style>
*{box-sizing:border-box;margin:0}
body{margin:0;overflow:hidden;width:1080px;background:#0B2F3A}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Figtree,sans-serif;color:#F4E9D6;background:linear-gradient(180deg,#F6B26B 0%,#FF9D6B 22%,#E56B6F 40%,#12606B 62%,#0B2F3A 100%)}
svg.art{position:absolute;inset:0}
.top{position:absolute;left:70px;right:70px;top:64px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:32px;letter-spacing:.04em;color:#0B2F3A}
.brand small{display:block;font-weight:500;font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.tag{font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#0B2F3A;border:3px solid #0B2F3A;border-radius:60px;padding:12px 26px}
h1{position:absolute;left:70px;top:178px;font-family:Fraunces,serif;font-weight:600;font-size:150px;line-height:.92;letter-spacing:-.02em;color:#0B2F3A}
h1 em{font-family:Fraunces,serif;font-style:italic;font-weight:400;display:block;font-size:104px;letter-spacing:-.01em;margin-top:14px;color:#FFF3E0}
.card{position:absolute;left:50px;right:50px;bottom:50px;height:410px;background:#F4E9D6;border-radius:34px;color:#0B2F3A;padding:44px 50px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.card:before{content:"";position:absolute;left:-16px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:#0B2F3A}
.card:after{content:"";position:absolute;right:-16px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:#0B2F3A}
.row1{height:220px;display:flex;justify-content:space-between;align-items:flex-start}
.dur{white-space:nowrap;font-family:Fraunces,serif;font-weight:600;font-size:50px;line-height:1}
.dur span{color:#FF7A59;font-style:italic;font-weight:400}
.inc{margin-top:22px;font-size:32px;font-weight:500;line-height:1.35}
.inc b{font-weight:700}
.price{text-align:right}
.price small{display:block;font-size:28px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#12606B}
.price strong{font-family:Fraunces,serif;font-weight:600;font-size:96px;line-height:.95;letter-spacing:-.02em;white-space:nowrap}
.price strong i{font-size:40px;font-style:normal;font-family:Figtree;font-weight:700;letter-spacing:0}
.cta{position:absolute;left:50px;right:50px;bottom:40px;display:flex;justify-content:space-between;align-items:center;border-top:2px dashed rgba(11,47,58,.4);padding-top:26px;font-size:32px;font-weight:700}
.cta .btn{background:#FF7A59;color:#0B2F3A;border-radius:50px;padding:16px 34px}

<section class="slide">
