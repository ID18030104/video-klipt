<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>La ligne du midi — Studio Pilates Rive Gauche</title>
<!--
DIRECTION — Concept: « La ligne du midi », one continuous clay line stretches, coils into a clock arc, becomes a reformer strap/spring, underlines the price, then arches into the logo (bridge + shoulder-bridge).
Palette: Lin #F3ECE2 / Sable #E6D6C3 / Sauge #B7C1AB / Argile #C4836A (line only) / Encre #2E2925 / Argile foncée #9A5A43 (italic accents).
Type: Cormorant Garamond 300 (+italic) for titles and figures, Manrope 500/600 for labels.
Graphic language: organic simplex blobs, architect-fine line drawing, grain + soft vignette, lots of air.
Motion: slow, breathed, masks + expo.out entrances, all transitions carried by the line.
-->
<link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/300-italic.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/600.css">
<style>
:root{--lin:#F3ECE2;--sable:#E6D6C3;--sauge:#B7C1AB;--argile:#C4836A;--encre:#2E2925;--argf:#9A5A43}
html,body{margin:0;padding:0;background:var(--lin)}
body{width:1080px;height:1920px;overflow:hidden;position:relative;color:var(--encre)}
svg.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#txt{position:absolute;left:0;top:0;width:1080px;height:1920px}
.grp{position:absolute;left:0;top:0;width:1080px;height:1920px}
.m{position:absolute;overflow:hidden;white-space:nowrap;line-height:1;box-sizing:content-box}
.m>span{display:block;line-height:1;will-change:transform}
.c{font-family:'Cormorant Garamond',serif;font-weight:300;font-variant-numeric:lining-nums}
.mn{font-family:'Manrope',sans-serif}
em{font-style:italic;color:var(--argf);display:inline-block}
sup{font-size:.55em;line-height:0;position:relative;top:-.45em;vertical-align:baseline}
#mini{position:absolute;left:90px;top:250px;opacity:0}
#mini .rg{position:absolute;left:92px;top:2px;font:italic 300 34px/1 'Cormorant Garamond',serif;white-space:nowrap}
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;mix-blend-mode:multiply;opacity:.06;pointer-events:none}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 50%,rgba(46,41,37,0) 55%,rgba(46,41,37,.06) 100%);pointer-events:none}
</style></head>
<body>
<svg class="full" id="bg" viewBox="0 0 1080 1920">
  <path id="b0" fill="#E6D6C3"/><path id="b1" fill="#B7C1AB"/><path id="b2" fill="#EBCDBD" fill-opacity=".7"/>
  <g id="dial">
    <g id="ticks"></g>
    <line id="needle" x1="540" y1="930" x2="790" y2="930" stroke="#2E2925" stroke-width="3" stroke-linecap="round" opacity="0"/>
  </g>
  <g id="refstatic" fill="none" stroke="#2E2925" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <rect class="dr" x="110" y="1230" width="860" height="40" rx="18" pathLength="1"/>
    <rect class="dr" x="130" y="1270" width="40" height="50" rx="6" pathLength="1"/>
    <rect class="dr" x="330" y="1270" width="40" height="50" rx="6" pathLength="1"/>
    <rect class="dr" x="750" y="1270" width="40" height="50" rx="6" pathLength="1"/>
    <rect class="dr" x="930" y="1270" width="40" height="50" rx="6" pathLength="1"/>
    <path class="dr" d="M150 1230 V1110 H210" pathLength="1"/>
    <path class="dr" d="M950 1230 V1090" pathLength="1"/>
    <circle class="dr" cx="950" cy="1078" r="12" pathLength="1"/>
  </g>
  <path id="line" fill="none" stroke="#C4836A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
  <g id="carriage" opacity="0">
    <g id="cargrp" stroke="#2E2925" stroke-width="3" stroke-linejoin="round" opacity=".92">
      <rect x="380" y="1184" width="260" height="46" rx="14" fill="#E6D6C3"/>
      <rect x="570" y="1160" width="70" height="24" rx="10" fill="#E6D6C3"/>
    </g>
  </g>
  <g id="dots">
    <circle id="d1" cx="880" cy="930" r="11" fill="#C4836A"/><circle id="d2" cx="540" cy="590" r="11" fill="#C4836A"/>
  </g>
  <line id="rule" x1="480" y1="950" x2="600" y2="950" stroke="#2E2925" stroke-width="1.5"/>
  <g id="pastilles"></g>
  <rect id="pill" x="240" y="1248" width="600" height="84" rx="42" fill="none" stroke="#2E2925" stroke-width="2" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/>
  <line id="water" x1="240" y1="790" x2="840" y2="790" stroke="#2E2925" stroke-width="3" opacity=".6"/>
  <circle id="head" cx="260" cy="760" r="22" fill="#C4836A"/>
</svg>
<div id="txt"></div>
<div id="mini"><svg width="72" height="42" viewBox="0 0 240 140"><path d="M20 120 C20 30 220 30 220 120" fill="none" stroke="#C4836A" stroke-width="8" stroke-linecap="round"/><path d="M0 128 L240 128" stroke="#2E2925" stroke-width="3" opacity=".6"/><circle cx="8" cy="116" r="11" fill="#C4836A"/></svg><div class="rg">Rive Gauche</div></div>
<svg id="grain" viewBox="0 0 1080 1920"><filter id="gf" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#gf)"/></svg>
<div id="vig"></div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../lib/klipt-kit.js"></script>
<script type="module">
import {createNoise3D} from '../../node_modules/simplex-noise/dist/esm/simplex-noise.js';
const noise=createNoise3D(KK.rng(216));
const $=s=>document.querySelector(s), NS='http://www.w3.org/2000/svg';
const ez=n=>gsap.parseEase(n);
const P3=ez('power3.inOut'), SIN=ez('sine.inOut');
const txt=$('#txt');

/* ---------- text helper ---------- */
function grp(){const g=document.createElement('div');g.className='grp';txt.appendChild(g);return g}
function mk(g,html,o){
  const fs=o.fs,k=o.f==='m'?0.883:0.82,pad=0.15*fs;
  const d=document.createElement('div');d.className='m '+(o.f==='m'?'mn':'c');
  d.style.fontSize=fs+'px';d.style.paddingTop=pad+'px';d.style.height=fs+'px';d.style.paddingBottom=(0.28*fs)+'px';
  d.style.top=(o.base-k*fs-pad)+'px';
  if(o.x==='c'){d.style.left='0';d.style.width='1080px';d.style.textAlign='center'}else{d.style.left=o.x+'px'}
  if(o.wt)d.style.fontWeight=o.wt;if(o.it)d.style.fontStyle='italic';
  if(o.ls)d.style.letterSpacing=o.ls;if(o.col)d.style.color=o.col;if(o.op)d.style.opacity=o.op;
  const s=document.createElement('span');s.innerHTML=html;d.appendChild(s);g.appendChild(d);return s;
}
const NN='&#8239;',NB='&nbsp;';
const g1=grp(),g2=grp(),g3=grp(),g4=grp(),g5=grp();
const t1a=mk(g1,'Et si votre pause',{fs:138,f:'c',base:804,x:90,ls:'-0.015em'});
const t1b=mk(g1,'déjeuner',{fs:138,f:'c',base:942,x:90,ls:'-0.015em'});
const t1c=mk(g1,'vous <em id="etir">étirait</em>'+NN+'?',{fs:138,f:'c',base:1080,x:90,ls:'-0.015em'});
const t2l=mk(g2,'NOUVEAUX CRÉNEAUX DU MIDI',{fs:30,f:'m',wt:600,base:480,x:'c',ls:'0.24em'});
const t2a=mk(g2,'12h15',{fs:170,f:'c',base:900,x:'c',ls:'-0.01em'});
const t2b=mk(g2,'13h',{fs:170,f:'c',base:1110,x:'c',ls:'-0.01em'});
const t2s=mk(g2,'45 minutes rien que pour vous.',{fs:64,f:'c',it:1,base:1400,x:'c'});
const t3a=mk(g3,'À six,',{fs:150,f:'c',base:560,x:90,ls:'-0.015em'});
const t3b=mk(g3,'<em>pas plus.</em>',{fs:150,f:'c',base:710,x:90,ls:'-0.015em'});
const t3s=mk(g3,'Pilates sur reformer, en petit groupe.',{fs:36,f:'m',wt:500,base:900,x:90});
const t4p=mk(g4,'Votre 1<sup>er</sup> cours',{fs:96,f:'c',base:680,x:'c'});
const t4x=mk(g4,'25'+NB+'€',{fs:380,f:'c',base:1080,x:'c',ls:'-0.02em'});
const t4l=mk(g4,'OFFRE DÉCOUVERTE',{fs:30,f:'m',wt:600,base:1300,x:'c',ls:'0.24em'});
const e1=mk(g5,'STUDIO PILATES',{fs:32,f:'m',wt:600,base:900,x:'c',ls:'0.32em'});
const e2=mk(g5,'Rive Gauche',{fs:120,f:'c',it:1,base:1030,x:'c'});
const e3=mk(g5,'Réservez votre <em>créneau</em>',{fs:72,f:'c',base:1220,x:'c'});
const e4=mk(g5,'Paris 7<sup>e</sup> &middot; Lien en bio',{fs:36,f:'m',wt:500,base:1320,x:'c'});
const e5=mk(g5,'@studiopilates.rivegauche',{fs:32,f:'m',wt:500,base:1390,x:'c',op:.7});
t2l.parentNode.style.letterSpacing='0.24em';

/* ---------- svg bits ---------- */
const ticks=$('#ticks'),tickEls=[];
for(let i=0;i<12;i++){const a=i*Math.PI/6,l=document.createElementNS(NS,'line');
  l.setAttribute('x1',540+310*Math.cos(a));l.setAttribute('y1',930+310*Math.sin(a));
  l.setAttribute('x2',540+292*Math.cos(a));l.setAttribute('y2',930+292*Math.sin(a));
  l.setAttribute('stroke','#2E2925');l.setAttribute('stroke-width','2');l.setAttribute('stroke-linecap','round');l.setAttribute('opacity','0');
  ticks.appendChild(l);tickEls.push(l)}
const pas=[];for(let i=0;i<6;i++){const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',103+i*48);c.setAttribute('cy',800);c.setAttribute('r',13);c.setAttribute('fill','#B7C1AB');c.setAttribute('fill-opacity','0');
  c.setAttribute('stroke','#2E2925');c.setAttribute('stroke-width','2');c.setAttribute('stroke-opacity','0');$('#pastilles').appendChild(c);pas.push(c)}
gsap.set('#needle',{svgOrigin:'540 930'});
gsap.set(['#d1','#d2'],{scale:0,transformOrigin:'50% 50%'});
gsap.set('#head',{scale:0,transformOrigin:'50% 50%'});
gsap.set('#water',{opacity:0});
gsap.set('#rule',{scaleX:0,svgOrigin:'540 950'});
gsap.set('.dr',{strokeDasharray:'1 2',strokeDashoffset:1});
gsap.set('#line',{strokeDasharray:'1 10'});
gsap.set(tickEls,{opacity:0});
pas.forEach(c=>gsap.set(c,{scale:.6,transformOrigin:'50% 50%'}));
[t1a,t1b,t1c,t2l,t2a,t2b,t2s,t3a,t3b,t3s,t4p,t4x,t4l,e1,e2,e3,e4,e5].forEach(s=>gsap.set(s,{yPercent:190}));

/* ---------- timeline ---------- */
const tl=gsap.timeline({paused:true});
const up=(el,at,d=.8)=>tl.to(el,{yPercent:0,duration:d,ease:'expo.out'},at);
const dn=(el,at,d=.38)=>tl.to(el,{yPercent:-190,duration:d,ease:'power2.in'},at);
// T1
up(t1a,.15);up(t1b,.27);up(t1c,.39);
tl.fromTo('#mini',{opacity:0,y:12},{opacity:.9,y:0,duration:.6,ease:'power3.out'},.4);
tl.fromTo('#etir',{letterSpacing:'-0.015em'},{letterSpacing:'0.07em',duration:1,ease:'expo.out'},1.0);
tl.fromTo(g1,{scale:1},{scale:1.02,duration:2.8,ease:'none',transformOrigin:'90px 1000px'},.3);
dn(t1a,3.0);dn(t1b,3.06);dn(t1c,3.12);
// T2
tl.to(tickEls,{opacity:.35,duration:.3,stagger:.03},3.55);
tl.to(['#d1'],{scale:1,duration:.5,ease:'back.out(2)'},3.75);tl.to(['#d2'],{scale:1,duration:.5,ease:'back.out(2)'},3.85);
up(t2l,3.55,.6);up(t2a,3.7);
tl.to('#rule',{scaleX:1,duration:.5,ease:'power2.out'},3.82);
up(t2b,3.9);up(t2s,4.3);
tl.to('#needle',{opacity:.25,duration:.3},3.8);
tl.to('#needle',{rotation:270,duration:2.4,ease:'sine.inOut'},3.8);
dn(t2l,6.15);dn(t2a,6.2);dn(t2b,6.25);dn(t2s,6.3);
tl.to(['#rule'],{opacity:0,duration:.3,ease:'power2.in'},6.15);
tl.to(tickEls,{opacity:0,duration:.35,ease:'power2.in'},6.15);
tl.to('#needle',{opacity:0,duration:.35},6.15);
tl.to(['#d1','#d2'],{scale:0,duration:.35,ease:'power2.in'},6.2);
// T3
const drs=gsap.utils.toArray('.dr');
drs.forEach((e,i)=>tl.to(e,{strokeDashoffset:0,duration:.8,ease:'power2.out'},6.4+i*.05));
tl.to('#carriage',{opacity:1,duration:.5,ease:'power2.out'},6.75);
up(t3a,6.7);up(t3b,6.82);
pas.forEach((c,i)=>{tl.to(c,{attr:{'fill-opacity':1,'stroke-opacity':1},scale:1,duration:.5,ease:'back.out(2)'},7.1+i*.1)});
up(t3s,7.4,.7);
dn(t3a,9.45);dn(t3b,9.5);dn(t3s,9.55);
pas.forEach((c,i)=>tl.to(c,{attr:{'fill-opacity':0,'stroke-opacity':0},duration:.3,ease:'power2.in'},9.5+i*.03));
tl.to('#carriage',{opacity:0,duration:.35},9.55);
[...drs].reverse().forEach((e,i)=>tl.to(e,{strokeDashoffset:-1,duration:.5,ease:'power2.in'},9.55+i*.03));
tl.to('#refstatic',{opacity:0,duration:.4,ease:'power2.in'},9.75);
// T4
up(t4p,10.0);
tl.fromTo(t4x,{letterSpacing:'0.06em'},{letterSpacing:'-0.02em',duration:1,ease:'expo.out'},10.15);
up(t4x,10.15,1.0);
tl.to('#pill',{strokeDashoffset:0,duration:.6,ease:'power2.inOut'},10.7);
up(t4l,10.9,.7);
tl.fromTo(g4,{scale:1},{scale:1.025,duration:1.2,ease:'sine.inOut',transformOrigin:'540px 900px'},11.3);
dn(t4p,12.4);dn(t4x,12.45);dn(t4l,12.5);
tl.to('#pill',{opacity:0,duration:.4,ease:'power2.in'},12.4);
tl.to('#mini',{opacity:0,y:-14,duration:.35,ease:'power2.in'},12.4);
// End card
tl.to('#water',{opacity:.6,duration:.3},13.1);
tl.fromTo('#water',{scaleX:0,svgOrigin:'540 790'},{scaleX:1,svgOrigin:'540 790',duration:.6,ease:'power2.out'},13.1);
tl.to('#head',{scale:1,duration:.5,ease:'back.out(2)'},13.3);
up(e1,13.35);up(e2,13.45);up(e3,13.8);up(e4,14.0,.7);up(e5,14.1,.7);

/* ---------- line geometry ---------- */
const N=220;
function resample(pts){
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=cum[cum.length-1],out=[];let j=1;
  for(let k=0;k<N;k++){const s=L*k/(N-1);while(j<pts.length-1&&cum[j]<s)j++;
    const a=pts[j-1],b=pts[j],seg=cum[j]-cum[j-1]||1,u=(s-cum[j-1])/seg;out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}
  return out}
const bez=(p0,p1,p2,p3,n=120)=>{const o=[];for(let i=0;i<=n;i++){const u=i/n,v=1-u;
  o.push([v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]])}return o};
const shapeH=d=>{const o=[];for(let i=0;i<N;i++){const u=i/(N-1);o.push([90+900*u,1160+d*Math.sin(Math.PI*u)])}return o};
const shapeClock=(()=>{const o=[];for(let i=0;i<=300;i++){const a=i/300*1.5*Math.PI;o.push([540+340*Math.cos(a),930+340*Math.sin(a)])}return resample(o)})();
const shapeUnder=k=>resample(bez([250,1150],[440,1150-22*k],[640,1150+22*k],[830,1150]));
const shapeArch=(a)=>{const S=(x,y)=>[240+2.5*x,470+2.5*y];return resample(bez(S(20,120),S(20,30-a),S(220,30-a),S(220,120)))};
function shapeRef(off){
  const cy=1207,p=[[950,1090],[640+off,cy],[380+off,cy]];
  const x0=210,x1=380+off,n=12;
  for(let i=1;i<=n;i++)p.push([x0+(x1-x0)*(1-(i-.5)/n),cy+(i%2?-11:11)]);
  p.push([x0,cy]);return resample(p)}
function mix(a,b,u){const o=new Array(N);for(let i=0;i<N;i++)o[i]=[a[i][0]+(b[i][0]-a[i][0])*u,a[i][1]+(b[i][1]-a[i][1])*u];return o}
const breath=t=>{const s=t-7.2;if(s<0||s>2.2)return 0;return -120*(.5-.5*Math.cos(2*Math.PI*s/2.2))};
const uK=t=>1-.7273*ez('power2.out')(KK.prog(t,10.2,.8)); // wave amp factor 1 -> 6/22
function linePts(t){
  const wob=t<.9?0:(t<1.8?22*Math.exp(-3.6*(t-.9))*Math.cos(2*Math.PI*2.2*(t-.9)):0);
  if(t<3.05)return shapeH(wob);
  if(t<3.75)return mix(shapeH(0),shapeClock,P3((t-3.05)/.7));
  if(t<6.2)return shapeClock;
  if(t<6.95)return mix(shapeClock,shapeRef(0),P3((t-6.2)/.75));
  if(t<9.5)return shapeRef(breath(t));
  if(t<10.2)return mix(shapeRef(0),shapeUnder(1),P3((t-9.5)/.7));
  if(t<12.45)return shapeUnder(uK(t));
  if(t<13.15)return mix(shapeUnder(uK(12.45)),shapeArch(0),P3((t-12.45)/.7));
  return shapeArch(4*Math.sin(2*Math.PI*(t-13.15)/3));
}
const dOf=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
const lineEl=$('#line'),car=$('#cargrp');

/* ---------- blobs ---------- */
const BK=[ // per beat: [x,y,R]
 [[820,520,430],[540,960,470],[300,1200,520],[540,1000,470],[540,820,480]],
 [[160,1500,330],[930,380,260],[900,1500,300],[130,420,250],[220,1450,280]],
 [[980,1320,240],[120,1480,280],[880,500,230],[950,1450,300],[880,1400,260]]];
const TR=[3.3,6.5,9.8,12.8];
function blobState(b,t){
  let i=0,u=0;for(let k=0;k<4;k++){const w=SIN(KK.prog(t,TR[k]-.5,1));if(w>0){i=k;u=w}else if(t>=TR[k]+.5)i=k+1;}
  // resolve: base beat index & blend
  let beat=0;for(let k=0;k<4;k++)if(t>=TR[k]+.5)beat=k+1;
  let nb=beat,w=0;for(let k=0;k<4;k++){if(t>TR[k]-.5&&t<TR[k]+.5){beat=k;nb=k+1;w=SIN(KK.prog(t,TR[k]-.5,1))}}
  const a=BK[b][beat],c=BK[b][nb];return [0,1,2].map(j=>a[j]+(c[j]-a[j])*w)}
function blobPath(b,t){
  let [cx,cy,R]=blobState(b,t);
  if(b===0)R+=30*ez('sine.inOut')(KK.prog(t,10.3,2.1))*(t<12.8?1:0)+(t>=12.8?0:0);
  const off=b*17.3,M=64,pts=[];
  cx+=18*noise(off,1.7,t*.1);cy+=18*noise(off,9.1,t*.1);R*=1+.04*noise(off,4.4,t*.1);
  for(let i=0;i<M;i++){const a=i/M*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);
    const r=R*(1+.12*noise(ca*.9+off,sa*.9+off,t*.15+off));pts.push([cx+r*ca,cy+r*sa])}
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<M;i++){const p0=pts[(i-1+M)%M],p1=pts[i],p2=pts[(i+1)%M],p3=pts[(i+2)%M];
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)}
  return d+'Z'}
const blobs=[$('#b0'),$('#b1'),$('#b2')];

window.KLIPT={width:1080,height:1920,fps:30,duration:16,
  ready:document.fonts.ready,
  render(t){
    tl.seek(t,false);
    blobs.forEach((e,i)=>e.setAttribute('d',blobPath(i,t)));
    lineEl.setAttribute('d',dOf(linePts(t)));
    if(t<.9){const p=.08+.92*ez('power2.inOut')(t/.9);lineEl.style.strokeDasharray=p+' 10'}else lineEl.style.strokeDasharray='none';
    const o=(t>=6.2&&t<=9.6)?(t<9.5?breath(t):0):0;
    car.setAttribute('transform','translate('+o+' 0)');
  }};
</script>
</body></html>
