<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Radar pollen</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/unbounded/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/unbounded/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/figtree/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-mono/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-mono/700.css">
<style>
:root{
  --map:#E6ECE4; --clear:#FBFCF8; --ink:#0F2B25; --ink-2:#3C5550; --green:#17835A;
  --p1:#F3DC5A; --p2:#EBAE3C; --p3:#DE6F3F; --p4:#B8432E;
  --display:"Unbounded",sans-serif; --body:"Figtree",sans-serif; --mono:"Space Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;margin:0;overflow:hidden;background:var(--map);color:var(--ink)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--map)}
.slide canvas{position:absolute;inset:0;width:1080px;height:1350px}
.top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 56px;
  background:var(--ink);color:var(--clear);font:700 24px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.top .live{display:flex;align-items:center;gap:16px}
.top .dot{width:16px;height:16px;border-radius:50%;background:var(--p1);box-shadow:0 0 0 6px rgba(243,220,90,.25)}
.top .idx{color:#A9C3BA}
.zone{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.zone .ico{width:84px;height:84px;color:var(--green);margin-bottom:26px}
.zone .ico svg{width:100%;height:100%;stroke-width:1.75}
.kicker{font:700 24px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:26px}
.zone h2{font:700 62px/1.08 var(--display);letter-spacing:-.025em;text-wrap:balance}
.zone p{font:500 34px/1.36 var(--body);color:var(--ink-2);margin-top:28px;text-wrap:pretty}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--clear);border-top:3px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;padding:0 56px;font:400 22px/1 var(--mono);color:var(--ink-2);letter-spacing:.04em}
.legend{display:flex;flex-direction:column;gap:14px}
.legend .lab{font-weight:700;color:var(--ink);letter-spacing:.14em;text-transform:uppercase}
.legend .scale{display:flex;align-items:center;gap:6px}
.legend .scale i{display:block;width:58px;height:22px}
.legend .scale span{margin:0 10px}
.frames{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.frames .row{display:flex;gap:8px}
.frames .row b{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--ink);font:700 20px/1 var(--mono);color:var(--ink)}
.frames .row b.on{background:var(--green);border-color:var(--green);color:#fff}
.frames .row b.done{background:var(--ink);color:var(--clear)}
/* cover */
.cover-title{position:absolute;left:56px;top:150px;width:900px;background:var(--clear);padding:52px 56px 56px;border:3px solid var(--ink)}
.cover-title .kicker{color:var(--ink-2)}
.cover-title h1{font:700 116px/1 var(--display);letter-spacing:-.045em;margin-bottom:32px}
.cover-title .sub{font:700 46px/1.15 var(--body);color:var(--green)}
.you{position:absolute;font:700 24px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-align:center}
.swipe{position:absolute;left:56px;bottom:186px;background:var(--ink);color:var(--clear);font:700 24px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:20px 26px}
.note{margin-top:34px;border:3px solid var(--ink);padding:20px 28px;font:700 30px/1.3 var(--body);color:var(--ink);background:var(--clear)}
.sign{margin-top:30px;font:700 24px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
</style>
</head>
<body>
<div id="root"></div>
<script src="../../lib/klipt-kit.js"></script>
<script src="icons.js"></script>
<script>
window.KLIPT = { width:1080, height:1350 };
const NBSP = ' ';
const SL = [
  {cover:true, cx:780, cy:880, r:130},
  {n:1, icon:'droplets', t:'Rincer le nez', p:'Un rinçage du nez évacue les pollens déposés au fil de la journée.', cx:500, cy:610, r:390},
  {n:2, icon:'sunrise', t:'Aérer tôt le matin ou tard le soir', p:'Ouvrez les fenêtres quand l’air est le moins chargé en pollens.', cx:590, cy:660, r:410},
  {n:3, icon:'shower-head', t:'Se laver les cheveux le soir', p:'Les pollens s’accrochent aux cheveux. Un shampoing le soir, et ils restent loin de l’oreiller.', cx:490, cy:640, r:420},
  {n:4, icon:'glasses', t:'Porter des lunettes', p:'Dehors, elles font écran entre vos yeux et les pollens.', cx:580, cy:620, r:435},
  {n:5, icon:'radar', t:'Suivre les pollens', p:'Un œil sur le bulletin pollen pour anticiper les jours les plus chargés.', cx:510, cy:660, r:450},
  {n:6, icon:'messages-square', t:'Demander conseil au pharmacien', p:'Au comptoir, nous vous orientons vers la solution adaptée.', cx:540, cy:650, r:505, last:true},
];

/* --- deterministic gradient noise --- */
const R = KK.rng(218);
const perm = new Uint8Array(512); { const p=[...Array(256).keys()]; for(let i=255;i>0;i--){const j=Math.floor(R()*(i+1)); [p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++) perm[i]=p[i&255]; }
const G = [...Array(256)].map(()=>{const a=R()*Math.PI*2; return [Math.cos(a),Math.sin(a)];});
const fade = t=>t*t*t*(t*(t*6-15)+10);
function noise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const g=(i,j)=>{const v=G[perm[(perm[(xi+i)&255]+yi+j)&255]]; return v[0]*(xf-i)+v[1]*(yf-j);};
  const u=fade(xf), v=fade(yf);
  return KK.lerp(KK.lerp(g(0,0),g(1,0),u), KK.lerp(g(0,1),g(1,1),u), v); }
function fbm(x,y){ let s=0,a=.5,f=1; for(let o=0;o<4;o++){ s+=a*noise(x*f,y*f); a*=.5; f*=2.03; } return s; }

const LEVELS = ['#F3DC5A','#EBAE3C','#DE6F3F','#B8432E'];
const TOTAL = 1080*SL.length;
function field(gx,gy){
  // pollen front drifting from the west, thinning toward the last slides
  const warp = fbm(gx/900+11, gy/900+3)*420;
  let v = fbm((gx+warp)/520, (gy-warp*.5)/520)*1.25 + .5;
  v += .16*Math.sin(gx/1300 + gy/700);
  const clearing = 1.08 - .2*Math.pow(gx/TOTAL, 1.3);
  return v*clearing;
}

function drawRadar(cv, i, s){
  const W=1080,H=1350, ctx=cv.getContext('2d');
  cv.width=W; cv.height=H;
  ctx.fillStyle='#E6ECE4'; ctx.fillRect(0,0,W,H);
  // map: faint contours of the land
  ctx.strokeStyle='rgba(15,43,37,.07)'; ctx.lineWidth=2;
  for(let y=0;y<H;y+=6){ /* sparse relief */ }
  const C=10;
  for(let y=0;y<H;y+=C){
    for(let x=0;x<W;x+=C){
      const gx=i*1080+x+C/2, gy=y+C/2;
      let v=field(gx,gy);
      const d=Math.hypot(gx-i*1080-s.cx, gy-s.cy);
      const edge = KK.clamp((d - s.r)/170);        // 0 inside zone, 1 far away
      v *= edge<=0 ? 0 : (.35 + .65*Math.sqrt(edge));
      let lv=-1;
      if(v>.40) lv=0; if(v>.53) lv=1; if(v>.65) lv=2; if(v>.77) lv=3;
      if(lv>=0){ ctx.fillStyle=LEVELS[lv]; ctx.fillRect(x,y,C,C); }
    }
  }
  // river (continuous across slides)
  ctx.strokeStyle='rgba(83,140,160,.55)'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath();
  for(let x=-20;x<=W+20;x+=10){ const gx=i*1080+x; const y=1010+Math.sin(gx/610)*70+fbm(gx/700,4.2)*160; x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.stroke();
  // lat/long grid
  ctx.strokeStyle='rgba(15,43,37,.13)'; ctx.lineWidth=1.5;
  for(let gx=Math.ceil(i*1080/135)*135; gx<(i+1)*1080; gx+=135){ const x=gx-i*1080; ctx.beginPath(); ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); ctx.stroke(); }
  for(let y=135;y<H;y+=135){ ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke(); }
  // clear zone
  ctx.fillStyle='#FBFCF8'; ctx.beginPath(); ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#0F2B25'; ctx.lineWidth=3; ctx.stroke();
  // range rings + ticks
  ctx.setLineDash([4,12]); ctx.lineWidth=2; ctx.strokeStyle='rgba(23,131,90,.45)';
  ctx.beginPath(); ctx.arc(s.cx,s.cy,s.r-28,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#0F2B25'; ctx.lineWidth=3;
  for(let k=0;k<72;k++){ const a=k/72*Math.PI*2, l=k%18===0?34:(k%6===0?20:10);
    ctx.beginPath(); ctx.moveTo(s.cx+Math.cos(a)*s.r, s.cy+Math.sin(a)*s.r); ctx.lineTo(s.cx+Math.cos(a)*(s.r+l), s.cy+Math.sin(a)*(s.r+l)); ctx.stroke(); }
}

function icon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`; }
function fr(s){ return s.replace(/ ([:;!?])/g, NBSP+'$1').replace(/« /g,'«'+NBSP).replace(/ »/g,NBSP+'»'); }

const root=document.getElementById('root');
SL.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  const cv=document.createElement('canvas'); el.appendChild(cv);
  const frames=[1,2,3,4,5,6].map(k=>`<b class="${s.n===k?'on':(s.n>k?'done':'')}">${k}</b>`).join('');
  let html=`<div class="top"><span class="live"><span class="dot"></span>Bulletin pollen · Angers</span><span class="idx">${String(i+1).padStart(2,'0')} / 07</span></div>`;
  if(s.cover){
    html+=`<div class="cover-title"><div class="kicker">Pharmacie du Marché · Printemps</div>
      <h1>Allergies de printemps</h1><div class="sub">6 réflexes pour mieux respirer</div></div>
      <div class="zone" style="left:${s.cx-s.r}px;top:${s.cy-s.r}px;width:${2*s.r}px;height:${2*s.r}px"><div class="ico" style="width:70px;height:70px;margin:0;color:var(--ink)">${icon('crosshair')}</div></div>
      <div class="you" style="left:${s.cx-200}px;top:${s.cy+s.r+44}px;width:400px"><span style="background:var(--clear);padding:8px 14px;border:2px solid var(--ink)">Vous êtes ici</span></div>
      <div class="swipe">Faites glisser →</div>`;
  } else {
    const w = Math.round(s.r*1.5);
    html+=`<div class="zone" style="left:${s.cx-w/2}px;top:${s.cy-s.r}px;width:${w}px;height:${2*s.r}px">
      <div class="ico">${icon(s.icon)}</div><div class="kicker">Réflexe 0${s.n}</div>
      <h2>${fr(s.t)}</h2><p>${fr(s.p)}</p>
      ${s.last?`<div class="note">Symptômes importants${NBSP}? Consultez un médecin.</div><div class="sign">Pharmacie du Marché · Angers</div>`:''}</div>`;
  }
  html+=`<div class="foot"><div class="legend"><span class="lab">Pollen</span><div class="scale">faible<span></span>${LEVELS.map(c=>`<i style="background:${c}"></i>`).join('')}<span></span>élevé</div></div>
    <div class="frames"><span>${s.cover?'Zone dégagée · 6 étapes':'Zone dégagée · étape '+s.n+' / 6'}</span><div class="row">${frames}</div></div></div>`;
  el.insertAdjacentHTML('beforeend',html);
  root.appendChild(el);
  drawRadar(cv,i,s);
});
</script>
</body>
</html>
