<!--
DIRECTION
Concept: a playful top-down city drawn as an illustration. The Feu Vert driving-school car rolls up a road; every
piece of info hangs on a road gantry that the car drives under (87 %, conduite accompagnée, 1 290 €), then it parks at the agency.
Palette: navy #0d2233, feu vert #12a05f, feu rouge #e5383b, amber #ffc233, asphalt #3d434c, cream #efe8d8.
Type: Bricolage Grotesque 800 (display) + Figtree (text).
Graphic language: top view, long drop shadows for height, road markings, roofs, trees, traffic-light logo.
Motion: snappy mask reveals on gantries, continuous forward scroll with easing at start/stop, red to green hook.
-->

<script>
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),im=x.createImageData(256,256),r=KK.rng(9);

function D(t){
  if(t<1.8)return 0;
  if(t<3)return 0.5*330/1.2*(t-1.8)**2;
  const V=330*13.6/13.4;
  if(t<16.4)return 198+V*(t-3);
  const b=198+V*13.4;
  if(t<17.8){const x=t-16.4;return b+330*(x-x*x/2.8)}

}

function block(side,d0,h,w){

  el(b,'abs',`left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:rgba(0,0,0,.15)`);
  const n=1+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){el(b,'abs',`left:${14+rnd()*(w-70)}px;top:${14+rnd()*(h-60)}px;width:${28+rnd()*18}px;height:${24+rnd()*14}px;background:#e9e9e6;border-radius:5px;box-shadow:5px 6px 0 rgba(0,0,0,.18)`)}
}
[-1,1].forEach(side=>{
  let d0=-760;
  while(d0<6700){
    const h=210+Math.floor(rnd()*140),w=170+Math.floor(rnd()*62);
    const bad=INTS.some(di=>d0+h>di-190&&d0<di+190)||(side>0&&d0+h>4780&&d0<6150);
    if(bad){d0+=60;continue}
    block(side,d0,h,w);d0+=h+34+Math.floor(rnd()*30);
  }
  for(let dd=-700;dd<6700;dd+=170+Math.floor(rnd()*80)){
    if(INTS.some(di=>Math.abs(dd-di)<170))continue;

  }
});

el(world,'abs',`left:846px;top:${ty(5320)}px;width:6px;height:340px;background:#f4f1e6`);
el(world,'abs',`left:1068px;top:${ty(5320)}px;width:6px;height:340px;background:#f4f1e6`);

el(world,'abs',`left:902px;top:${ty(5240)}px;width:120px;height:120px;border-radius:50%;background:#1466b8;opacity:.9`,'<div style="width:100%;height:100%;display:grid;place-items:center;color:#fff;font:800 74px Bricolage Grotesque">P</div>');

</svg>`}

 `<div class="abs" id="lr" style="left:22px;top:22px;width:80px;height:80px;border-radius:50%;background:#3a1d22"></div><div class="abs" id="la" style="left:110px;top:22px;width:80px;height:80px;border-radius:50%;background:#3a3220"></div><div class="abs" id="lgreen" style="left:198px;top:22px;width:80px;height:80px;border-radius:50%;background:#123d29"></div>
