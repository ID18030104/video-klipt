<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!--
ART DIRECTION — Orbitr "Timeline" launch (LinkedIn square post)
Concept: show, don't tell. A believable Timeline view caught mid-drag: one task lifted, its dependencies re-flowing, the team's load visible underneath.
Palette: paper #F2EFE8, ink #14161F, orbit orange #FF5A1F (accent, rare), steel blue #3D5AFE (secondary bars), line #D9D4C8.
Type: Manrope 800/600 for display + UI, JetBrains Mono for dates and numbers.
Graphic language: clean product UI on warm paper, faint orbit rings echoing the logo, fine grain.
-->
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/manrope/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/700.css">
<style>
:root{--paper:#F2EFE8;--ink:#14161F;--mute:#5B5E6A;--orange:#FF5A1F;--blue:#3D5AFE;--line:#E4E0D6;--card:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;margin:0;overflow:hidden;background:var(--paper)}
body{font-family:Manrope,sans-serif;color:var(--ink)}
.slide{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--paper)}
.rings{position:absolute;right:-260px;top:-300px;width:760px;height:760px}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none}
.logo{position:absolute;left:72px;top:62px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:40px;letter-spacing:-1.2px}
.pill{position:absolute;right:72px;top:66px;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:40px;padding:12px 22px 12px 14px;font-weight:700;font-size:24px}
.pill b{background:var(--orange);border-radius:30px;padding:4px 12px;font-size:18px;letter-spacing:1.5px;font-weight:800}
h1{position:absolute;left:72px;top:150px;font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-3px}
h1 em{font-style:normal;position:relative;white-space:nowrap}
h1 em svg{position:absolute;left:-4px;bottom:-14px;width:calc(100% + 8px);height:22px}
.sub{position:absolute;left:72px;top:334px;font-weight:600;font-size:30px;color:var(--mute);letter-spacing:-.3px}
.sub i{font-style:normal;color:var(--ink)}
.card{position:absolute;left:72px;top:404px;width:936px;height:548px;background:var(--card);border-radius:22px;box-shadow:0 1px 0 rgba(20,22,31,.06),0 30px 60px -20px rgba(20,22,31,.22),0 0 0 1px rgba(20,22,31,.07);overflow:hidden}
.bar-top{position:absolute;left:0;top:0;right:0;height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px}
.proj{font-weight:800;font-size:22px;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.proj .sw{width:14px;height:14px;border-radius:4px;background:var(--blue)}
.tabs{margin-left:auto;display:flex;background:#F3F2EE;border-radius:12px;padding:4px;gap:2px}
.tab{font-size:18px;font-weight:700;color:var(--mute);padding:7px 14px;border-radius:9px;display:flex;align-items:center;gap:7px}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab.on svg{color:var(--orange)}
.gantt{position:absolute;left:0;top:62px;right:0;height:338px}
.names{position:absolute;left:0;top:0;width:236px;height:100%;border-right:1px solid var(--line);background:#FBFAF7}
.hdr{position:absolute;top:0;height:44px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--mute);font-weight:500}
.rowname{position:absolute;left:22px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;height:58px}
.rowname .dot{width:9px;height:9px;border-radius:50%}
.col{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.wk{position:absolute;top:13px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--mute)}
.rowline{position:absolute;left:0;right:0;border-top:1px solid #F0EDE6}
.task{position:absolute;height:34px;border-radius:9px;display:flex;align-items:center;padding:0 10px;gap:8px;font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid #fff;flex:none}
.ghost{position:absolute;height:34px;border-radius:9px;border:2px dashed rgba(255,90,31,.55);background:rgba(255,90,31,.06)}
.today{position:absolute;top:36px;bottom:0;width:2px;background:var(--ink)}
.today span{position:absolute;top:-2px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:2px 7px;border-radius:5px}
.tip{position:absolute;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:16px;font-weight:600;box-shadow:0 12px 24px -8px rgba(0,0,0,.35);white-space:nowrap}
.tip b{font-family:'JetBrains Mono',monospace;font-weight:700;color:#FFB08F}
.tip small{display:block;font-size:14px;color:#B9BCC8;margin-top:3px;font-weight:600}
.load{position:absolute;left:0;right:0;bottom:0;height:148px;border-top:1px solid var(--line);background:#FBFAF7;padding:18px 22px}
.load h4{font-size:15px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.load h4 span{font-family:'JetBrains Mono',monospace;letter-spacing:0;text-transform:none;font-weight:500}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:16px}
.p{display:flex;flex-direction:column;gap:8px}
.p .top{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700}
.p .top .av{width:30px;height:30px;font-size:12px;border:none}
.p .top .pc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.meter{height:10px;border-radius:6px;background:#ECE9E1;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.meter .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.p .role{font-size:14px;color:var(--mute);font-weight:600}
.over .pc{color:var(--orange)}
.foot{position:absolute;left:72px;right:72px;top:992px;display:flex;align-items:center;justify-content:space-between}
.foot .l{font-weight:800;font-size:30px;letter-spacing:-.5px}
.foot .r{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;display:flex;align-items:center;gap:12px}
.foot .r .arr{width:44px;height:44px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
</style></head>
<body>
<section class="slide">
  <svg class="rings" viewBox="0 0 760 760" fill="none">
    <circle cx="380" cy="380" r="370" stroke="#14161F" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="380" cy="380" r="280" stroke="#14161F" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="380" cy="380" r="190" stroke="#14161F" stroke-opacity=".06" stroke-width="2" stroke-dasharray="4 10"/>
    <circle cx="347" cy="567" r="10" fill="#FF5A1F" fill-opacity=".85"/>
    <circle cx="570" cy="660" r="6" fill="#14161F" fill-opacity=".25"/>
  </svg>
  <svg class="grain" width="1080" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

  <div class="logo">
    <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="17" fill="none" stroke="#14161F" stroke-width="5"/><circle cx="36.5" cy="10" r="6.5" fill="#FF5A1F" stroke="#F2EFE8" stroke-width="3"/></svg>
    orbitr
  </div>
  <div class="pill"><b>NEW</b>Timeline view</div>

  <h1>Every project, every<br>person, <em>one timeline.<svg viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M4 15 C 90 5, 220 3, 396 11" stroke="#FF5A1F" stroke-width="7" fill="none" stroke-linecap="round"/></svg></em></h1>
  <p class="sub"><i>Drag-and-drop Gantt.</i> Live dependencies. Real team workload.</p>

  <div class="card">
    <div class="bar-top">
      <div class="proj"><span class="sw"></span>Northwind · Rebrand</div>
      <div class="tabs">
        <div class="tab">List</div>
        <div class="tab">Board</div>
        <div class="tab on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h9M8 12h10M6 18h8"/></svg>Timeline</div>
      </div>
    </div>
    <div class="gantt" id="g"></div>
    <div class="load">
      <h4>Team workload<span>Week of Oct 19</span></h4>
      <div class="people" id="people"></div>
    </div>
  </div>

  <div class="foot">
    <div class="l">Live now on every plan.</div>
    <div class="r">orbitr.io/timeline<span class="arr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
  </div>
</section>
<script>
window.KLIPT={width:1080,height:1080};
(function(){
  const g=document.getElementById('g');
  const L=236, W=936-L, DAYS=35, dx=W/DAYS, HDR=44, RH=58;
  const X=d=>L+d*dx;
  let h='';
  h+=`<div class="names"></div><div class="hdr" style="left:${L}px;right:0"></div>`;
  const weeks=['Oct 5','Oct 12','Oct 19','Oct 26','Nov 2'];
  weeks.forEach((w,i)=>{h+=`<div class="col" style="left:${X(i*7)}px;${i==0?'border-left:none;':''}"></div><div class="wk" style="left:${X(i*7)+12}px">${w}</div>`});
  const col={ink:'#14161F',blue:'#3D5AFE',or:'#FF5A1F',teal:'#12A388',plum:'#7A4DD8'};
  const tasks=[
    {n:'Discovery',s:0,e:4.6,c:col.ink,a:[['MR','#FF5A1F']],lbl:'Done',dot:'#14161F'},
    {n:'Moodboards',s:3,e:10,c:col.blue,a:[['PS','#12A388']],lbl:'Moodboards',dot:'#3D5AFE'},
    {n:'Logo concepts',s:14,e:22,c:col.or,a:[['MR','#14161F']],lbl:'Logo concepts',drag:true,gs:11,dot:'#FF5A1F'},
    {n:'Brand guidelines',s:24,e:30.4,c:col.blue,a:[['JL','#7A4DD8']],lbl:'Guidelines',dot:'#3D5AFE'},
    {n:'Website design',s:24,e:34.2,c:col.teal,a:[['TK','#3D5AFE'],['PS','#FF5A1F']],lbl:'Website design',dot:'#12A388'},
  ];
  tasks.forEach((t,i)=>{
    const y=HDR+i*RH;
    h+=`<div class="rowline" style="top:${y+RH}px"></div>`;
    h+=`<div class="rowname" style="top:${y}px"><span class="dot" style="background:${t.dot}"></span>${t.n}</div>`;
  });
  // today line
  h+=`<div class="today" style="left:${X(9.5)-1}px"><span>Today</span></div>`;
  // ghost
  const d=tasks[2];
  h+=`<div class="ghost" style="left:${X(d.gs)}px;width:${(d.e-d.s)*dx}px;top:${HDR+2*RH+12}px"></div>`;
  // dependency arrows
  const ty=i=>HDR+i*RH+29;
  const arrow=(x1,y1,x2,y2,hot)=>{const mx=x1+10;const c=hot?'#FF5A1F':'#9A9DA8';
    return `<path d="M${x1} ${y1} H${mx} Q${mx+6} ${y1} ${mx+6} ${y1+6} V${y2-6} Q${mx+6} ${y2} ${mx+12} ${y2} H${x2-6}" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M${x2-11} ${y2-5} L${x2-3} ${y2} L${x2-11} ${y2+5}" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`};
  let sv=`<svg style="position:absolute;left:0;top:0" width="936" height="338">`;
  sv+=arrow(X(10),ty(1),X(14),ty(2)+0,false);
  sv+=arrow(X(22),ty(2)-2,X(24),ty(3),true);
  sv+=arrow(X(22),ty(2)-2,X(24),ty(4),true);
  sv+=`</svg>`;
  h+=sv;
  tasks.forEach((t,i)=>{
    const y=HDR+i*RH+12;
    const av=t.a.map((a,k)=>`<span class="av" style="background:${a[1]};${k?'margin-left:-14px':''}">${a[0]}</span>`).join('');
    const extra=t.drag?`transform:translateY(-5px) rotate(-1.2deg);box-shadow:0 16px 26px -8px rgba(255,90,31,.55),0 0 0 3px rgba(255,90,31,.25);`:'';
    const done=i===0?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`:'';
    h+=`<div class="task" style="left:${X(t.s)}px;width:${(t.e-t.s)*dx}px;top:${y}px;background:${t.c};${extra}">${av}${done}<span>${t.lbl}</span></div>`;
  });
  // tooltip + cursor
  const cx=X(19.2), cy=HDR+2*RH+30;
  h+=`<div class="tip" style="left:${X(13.2)}px;top:${HDR+2*RH-54}px">Oct 19 – Oct 27 <b>+3 days</b></div>`;
  h+=`<svg style="position:absolute;left:${cx}px;top:${cy}px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))" width="34" height="38" viewBox="0 0 24 26"><path d="M3 2 L3 20 L8 15.5 L11.5 23 L14.5 21.6 L11 14.4 L18 14.4 Z" fill="#14161F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  // shifted chip
  h+=`<div class="tip" style="left:${X(23.6)}px;top:${HDR+3*RH-10}px;background:#FFF1EA;color:#B8360A;box-shadow:none;border:1.5px solid #FFC7AF;padding:5px 10px;font-size:14px;font-weight:800;display:none"></div>`;
  g.innerHTML=h;

  const ppl=[
    ['MR','Maya R.','Design lead','#FF5A1F',112],
    ['TK','Theo K.','Designer','#3D5AFE',86],
    ['PS','Priya S.','Web designer','#12A388',64],
    ['JL','Jonas L.','Strategist','#7A4DD8',92],
  ];
  document.getElementById('people').innerHTML=ppl.map(p=>{
    const over=p[4]>100; const w=Math.min(p[4],100)/1.2*1; // scale 0–120%
    return `<div class="p ${over?'over':''}"><div class="top"><span class="av" style="background:${p[3]}">${p[0]}</span>${p[1]}<span class="pc">${p[4]}%</span></div>
    <div class="meter"><i style="width:${p[4]/120*100}%;background:${over?'#FF5A1F':'#14161F'}"></i><span class="cap" style="left:${100/1.2}%"></span></div>
    <div class="role">${p[2]}${over?' · over capacity':''}</div></div>`}).join('');
})();
</script>
</body></html>
