<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Nexus Cup 4</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/900.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/big-shoulders-display/800.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/700.css">
<style>
:root{--bg:#080B12;--ink:#F2F5FA;--lime:#C8FF2E;--mute:#8C96AB;--line:rgba(242,245,250,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;background:var(--bg)}
body{overflow:hidden}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace}
.bgglow{position:absolute;inset:0;background:radial-gradient(700px 520px at 78% 52%,rgba(200,255,46,.10),transparent 70%),radial-gradient(600px 400px at 10% 8%,rgba(60,90,170,.18),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:90px 90px;opacity:.10}
.abs{position:absolute}
.hud{left:60px;right:60px;top:56px;height:46px;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hud .live{display:flex;align-items:center;gap:14px;color:var(--lime)}
.hud .dot{width:18px;height:18px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px var(--lime)}
.hudline{left:60px;right:60px;top:112px;height:2px;background:var(--line)}
.kick{left:60px;top:140px;font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--lime)}
.title{left:54px;top:192px;font-family:'Big Shoulders Display';font-weight:900;font-size:262px;line-height:.86;letter-spacing:-.005em;white-space:nowrap;text-transform:uppercase;color:var(--ink)}
.title i{font-style:normal;color:var(--lime)}
.band{left:0;top:420px;width:1080px;height:400px;overflow:hidden;border-top:2px solid var(--lime);border-bottom:2px solid var(--line)}
.band img{position:absolute;left:0;top:-158px;width:1080px;height:auto;filter:url(#duo) contrast(1.15) brightness(1.05)}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,18,.10) 0%,rgba(8,11,18,0) 30%,rgba(8,11,18,.4) 70%,rgba(8,11,18,.92) 100%)}
.reticle{left:262px;top:508px;width:330px;height:172px;z-index:3}
.reticle b{position:absolute;width:34px;height:34px;border:0 solid var(--lime)}
.reticle .a{left:0;top:0;border-width:5px 0 0 5px}.reticle .b{right:0;top:0;border-width:5px 5px 0 0}
.reticle .c{left:0;bottom:0;border-width:0 0 5px 5px}.reticle .d{right:0;bottom:0;border-width:0 5px 5px 0}
.tag{z-index:3;font-size:28px;font-weight:700;letter-spacing:.1em;background:var(--lime);color:#0a0d14;padding:6px 16px}
.prizelabel{right:60px;top:648px;z-index:4;font-size:30px;font-weight:700;letter-spacing:.2em;color:var(--ink)}
.prizelabel span{color:var(--lime)}
.prize{left:46px;top:694px;z-index:4;font-family:'Big Shoulders Display';font-weight:900;font-size:330px;line-height:.85;color:var(--lime);white-space:nowrap;text-shadow:0 0 60px rgba(200,255,46,.28)}
.prize small{font-size:330px}
.info{left:60px;right:60px;top:994px;height:120px;display:grid;grid-template-columns:1.25fr 1fr 1.05fr;border-top:2px solid var(--line);z-index:4}
.cell{padding:22px 0 0 0;border-right:2px solid var(--line);padding-left:22px}
.cell:first-child{padding-left:0}.cell:last-child{border-right:0}
.cell .big{font-family:'Big Shoulders Display';font-weight:800;font-size:56px;line-height:1;text-transform:uppercase}
.cell .sm{margin-top:8px;font-size:28px;font-weight:500;color:var(--mute);letter-spacing:.02em}
.cta{left:60px;right:60px;top:1142px;height:148px;background:var(--lime);color:#0a0d14;clip-path:polygon(0 0,calc(100% - 44px) 0,100% 44px,100% 100%,0 100%);padding:16px 36px;z-index:4}
.cta .h{font-family:'Big Shoulders Display';font-weight:900;font-size:80px;line-height:.95;text-transform:uppercase}
.cta .r{position:absolute;left:36px;right:36px;bottom:16px;display:flex;justify-content:space-between;font-size:28px;font-weight:700}
.grain{position:absolute;inset:0;z-index:9;opacity:.10;mix-blend-mode:overlay;pointer-events:none}
.scan{position:absolute;inset:0;z-index:8;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 4px);pointer-events:none}
.vig{position:absolute;inset:0;z-index:7;background:radial-gradient(120% 90% at 50% 50%,transparent 60%,rgba(0,0,0,.45));pointer-events:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="duo" color-interpolation-filters="sRGB">
<feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
<feComponentTransfer>
<feFuncR type="table" tableValues="0.05 0.15 0.62 0.95"/>
<feFuncG type="table" tableValues="0.07 0.21 0.92 1.00"/>
<feFuncB type="table" tableValues="0.10 0.25 0.20 0.60"/>
</feComponentTransfer></filter>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.1"/></filter>
</defs></svg>
<section class="slide">
  <div class="bgglow"></div><div class="grid"></div>
  <div class="abs hud"><span>Nexus Arena · Lille</span><span class="live"><i class="dot"></i>Finale en direct</span></div>
  <div class="abs hudline"></div>
  <div class="abs kick">TOURNOI 5V5 // FPS TACTIQUE</div>
  <div class="abs title" id="title">Nexus Cup <i>#4</i></div>

  <div class="abs band"><img src="assets/keys.jpg" alt=""></div>
  <div class="abs reticle"><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b></div>
  <div class="abs tag" style="left:60px;top:440px">60 POSTES</div>
  <div class="abs tag" style="right:60px;top:440px;background:#F2F5FA">5V5</div>

  <div class="abs prizelabel">CASH<span>PRIZE</span> //</div>
  <div class="abs prize" id="prize">2&#8239;000&nbsp;€</div>

  <div class="abs info">
    <div class="cell"><div class="big">Sam. 18 avril</div><div class="sm">dès 10 h · Euratech</div></div>
    <div class="cell"><div class="big">32 équipes</div><div class="sm">en 5v5</div></div>
    <div class="cell"><div class="big">Finale live</div><div class="sm">sur notre chaîne</div></div>
  </div>

  <div class="abs cta">
    <div class="h">Inscris ton équipe</div>
    <div class="r"><span>50&nbsp;€ / équipe · jusqu’au 10 avril</span><span>nexus-arena.gg</span></div>
  </div>

  <div class="vig"></div><div class="scan"></div>
  <svg class="grain" width="1080" height="1350"><rect width="1080" height="1350" filter="url(#gr)"/></svg>
</section>
<script>
window.KLIPT={width:1080,height:1350};
document.fonts.ready.then(()=>{
  const fit=(el,w)=>{const s=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize=(s*w/el.getBoundingClientRect().width)+'px'};
  fit(document.getElementById('title'),970);
  fit(document.getElementById('prize'),960);
});
</script>
</body></html>
